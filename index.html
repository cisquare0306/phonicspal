    const pcmToWav = (base64, sampleRate) => {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binaryString.charCodeAt(i);
      const buffer = new ArrayBuffer(44 + len);
      const view = new DataView(buffer);
      const writeString = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
      writeString(0, 'RIFF'); view.setUint32(4, 36 + len, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data'); view.setUint32(40, len, true);
      new Uint8Array(buffer, 44).set(bytes);
      return buffer;
    };

    const AudioEngine = {
      ctx: null, activeSpeech: null, progressInterval: null, bgmPlaying: false, bgmTimer: null, nextNoteTime: 0, noteIdx: 0,
      
      init() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } if (this.ctx.state === 'suspended') { this.ctx.resume(); } },

      startBGM() {
        this.init();
        if (this.bgmPlaying) return;
        this.bgmPlaying = true; this.nextNoteTime = this.ctx.currentTime + 0.1; this.noteIdx = 0;
        const melody = [[196.00, 0.25], [261.63, 0.25], [0, 0.125], [329.63, 0.125], [261.63, 0.25], [196.00, 0.25], [293.66, 0.25], [349.23, 0.25], [0, 0.125], [392.00, 0.125], [349.23, 0.25], [293.66, 0.25]];
        const schedule = () => {
          if (!this.bgmPlaying) return;
          while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
            const [freq, dur] = melody[this.noteIdx];
            if (freq > 0) { this.playTone(freq, 'triangle', dur * 0.8, 0.015, this.nextNoteTime); this.playTone(freq, 'sine', dur * 0.5, 0.015, this.nextNoteTime); }
            this.nextNoteTime += dur; this.noteIdx = (this.noteIdx + 1) % melody.length;
          }
          this.bgmTimer = requestAnimationFrame(schedule);
        };
        schedule();
      },
      stopBGM() { this.bgmPlaying = false; if (this.bgmTimer) { cancelAnimationFrame(this.bgmTimer); this.bgmTimer = null; } },

      async speak(text, tone = "Say cheerfully and clearly:", voiceName = "Aoede", onProgress = null) {
        return new Promise(async (resolve) => {
          if (this.activeSpeech) { try { this.activeSpeech.stop(); } catch(e){} this.activeSpeech = null; }
          if (this.progressInterval) { clearInterval(this.progressInterval); this.progressInterval = null; }

          try {
            const payload = {
              contents: [{ parts: [{ text: `${tone} ${text}` }] }],
              generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName } } } }
            };

            // Connecting to your secure Vercel API Backend
            const response = await fetch('/api/gemini', {
              method: 'POST', 
              headers: { 'Content-Type': 'application/json' }, 
              body: JSON.stringify({ endpoint: 'gemini-2.5-flash-preview-tts:generateContent', payload })
            });

            if (!response.ok) throw new Error("API call failed");

            const data = await response.json();
            const inlineData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData;

            if (inlineData && inlineData.data) {
              const mimeType = inlineData.mimeType || "audio/L16; rate=24000";
              const rateMatch = mimeType.match(/rate=(\d+)/);
              const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
              const wavBuffer = pcmToWav(inlineData.data, sampleRate);
              
              this.init();
              const audioBuffer = await this.ctx.decodeAudioData(wavBuffer);
              const source = this.ctx.createBufferSource();
              source.buffer = audioBuffer; source.connect(this.ctx.destination);
              const duration = audioBuffer.duration;
              
              if (onProgress) {
                 const startTime = this.ctx.currentTime;
                 this.progressInterval = setInterval(() => {
                    const elapsed = this.ctx.currentTime - startTime;
                    if (elapsed >= duration) { clearInterval(this.progressInterval); onProgress(1); } 
                    else { onProgress(elapsed / duration); }
                 }, 50);
              }

              source.onended = () => { if (this.progressInterval) clearInterval(this.progressInterval); resolve(); };
              source.start(); this.activeSpeech = source;
            } else {
                throw new Error("No audio data returned");
            }
          } catch (err) {
            console.error("Gemini TTS Error:", err);
            // Browser Fallback if the internet disconnects
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text.toLowerCase());
              utterance.rate = 0.85; utterance.pitch = 1.2;
              utterance.onboundary = (e) => { if (e.name === 'word' && onProgress) { onProgress(e.charIndex / text.length); } };
              utterance.onend = () => { if (onProgress) onProgress(1); resolve(); };
              utterance.onerror = resolve;
              window.speechSynthesis.speak(utterance);
            } else resolve();
          }
        });
      }

        const recentWords = currentVocab.slice(-40).map(v => v.word).join(', ');
        const promptText = `Generate 10 simple ${currentLevel}-letter English words for toddlers to learn phonics. Exclude these words: ${recentWords}. Format strictly as JSON. Only use uppercase letters for the words. Keep them kid-friendly (animals, objects, nature). Output format MUST exactly match this structure: {"words": [{"word": "CAT", "emoji": "🐱"}]}`;
        
        const payload = {
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: { type: "OBJECT", properties: { words: { type: "ARRAY", items: { type: "OBJECT", properties: { word: { type: "STRING" }, emoji: { type: "STRING" } } } } } }
          }
        };

        const attemptFetch = async (retries = 3, delay = 1000) => {
          try {
            // Talk to our secure backend proxy
            const response = await fetch('/api/gemini', {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, 
              body: JSON.stringify({ endpoint: 'gemini-2.5-flash-preview-09-2025:generateContent', payload })
            });
            if (!response.ok) throw new Error("API request failed");

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (text) {
              const tick3 = String.fromCharCode(96, 96, 96);
              let cleanText = text.split(tick3 + 'json').join('').split(tick3 + 'JSON').join('').split(tick3).join('').trim();
              const parsedData = JSON.parse(cleanText);
              const wordsArray = Array.isArray(parsedData) ? parsedData : (parsedData.words || []);
              
              const newWords = wordsArray.map(item => ({
                 word: (item.word || item.Word || '').toUpperCase().trim(), emoji: item.emoji || item.Emoji || '✨'
              })).filter(item => item.word.length === currentLevel && !currentVocab.some(v => v.word === item.word));

              if (newWords.length > 0) {
                setVocabData(prev => ({ ...prev, [currentLevel]: [...(prev[currentLevel] || []), ...newWords] }));
                return; 
              }
            }
            throw new Error("Invalid format or duplicate words");
          } catch (e) {
            if (retries > 0) { await new Promise(res => setTimeout(res, delay)); await attemptFetch(retries - 1, delay * 2); }
          }
        };
        await attemptFetch();
        isFetchingWords.current = false;

        setIsGeneratingStory(true); setStory(null); setStoryImage(null); setHighlightIndex(-1);

        let wordsSubset = 'fun, playing';
        if (currentRunWordsRef.current.length > 0) {
          const shuffledWords = [...currentRunWordsRef.current].sort(() => 0.5 - Math.random());
          wordsSubset = shuffledWords.slice(0, 2).join(' and ');

        setGenerationPhase('image');
        let generatedBase64 = null;
        
        try {
          const imagePrompt = `A beautiful watercolor children's book illustration of a cartoon child (not a real photo, stylized 2d drawing only) in a simple, everyday real-life setting featuring: ${wordsSubset}. Bright, colorful, happy, masterpiece. No text.`;
          let imagePayload = { instances: [{ prompt: imagePrompt }], parameters: { sampleCount: 1 } };
          
          // Call our secure backend proxy!
          let imgRes = await fetch('/api/gemini', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ endpoint: 'imagen-4.0-generate-001:predict', payload: imagePayload })
          });
          
          let imgData = await imgRes.json();
          if (imgData.error) {
              imagePayload = { instances: { prompt: imagePrompt }, parameters: { sampleCount: 1 } };
              imgRes = await fetch('/api/gemini', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                  body: JSON.stringify({ endpoint: 'imagen-4.0-generate-001:predict', payload: imagePayload })
              });
              imgData = await imgRes.json();
          }
          
          if (imgData.predictions && imgData.predictions.length > 0) {
             const prediction = imgData.predictions[0];
             generatedBase64 = prediction.bytesBase64Encoded || prediction;
             setStoryImage(`data:image/png;base64,${generatedBase64}`);
          } else {
             setStoryImage('error');
          }
        } catch(e) { console.error("Image generation failed", e); setStoryImage('error'); }

        setGenerationPhase('text');
        try {
          const storyPrompt = `Look at this children's book illustration. Write a very simple, happy 2-sentence story about exactly what is happening in the picture. The main character is a kid named ${customChar.name || "the hero"}. MUST naturally include these words: ${wordsSubset}. Keep it grounded in reality, safe, peaceful, and cute. Only return the text of the story, no formatting.`;

          let storyPayload;
          if (generatedBase64 && storyImage !== 'error') {
              storyPayload = { contents: [{ parts: [ { text: storyPrompt }, { inlineData: { mimeType: "image/png", data: generatedBase64 } } ] }] };
          } else {
              storyPayload = { contents: [{ parts: [{ text: `Write a very simple, happy 2-sentence story about an everyday real-life activity for a kid named ${customChar.name || "the hero"}. MUST naturally include these words: ${wordsSubset}. Keep it grounded in reality, safe, peaceful, and cute.` }] }] };
          }

          // Call our secure backend proxy!
          const textResponse = await fetch('/api/gemini', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ endpoint: 'gemini-2.5-flash-preview-09-2025:generateContent', payload: storyPayload })
          });
          const textData = await textResponse.json();
          const generatedText = textData.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (generatedText) {
             const cleanText = generatedText.replace(/\*/g, '').trim();
             setStory(cleanText);
          } else setStory("Oh no! The story magic faded away. Let's try again next time!");
        } catch(e) {
          console.error("Story generation failed", e); setStory("Oops! The magic story spell fizzled out. Let's try again next time!");

               <div className="text-center bg-white p-6 md:p-10 rounded-[3rem] shadow-2xl border-[8px] md:border-[12px] border-red-200 animate-pop w-full max-w-lg my-8">
                  <h1 className="text-5xl md:text-6xl font-black text-red-500 mb-2 italic">GAME OVER</h1>

                  <div className="bg-sky-50 p-4 md:p-6 rounded-[2rem] border-4 border-sky-100 mb-6 min-h-[120px] flex flex-col justify-center transition-all">
                    {!isGeneratingStory && !storyImage && (
                      <button onClick={generateAdventureStory} className="w-full bg-indigo-500 hover:bg-indigo-400 text-white text-lg md:text-xl font-black py-4 rounded-full shadow-[0_6px_0_#3730a3] active:shadow-none active:translate-y-2 border-4 border-indigo-300 transition-all flex flex-col sm:flex-row items-center justify-center gap-2">
                        <Sparkles size={24} className="text-yellow-300" /><span>✨ Tell My Adventure Story ✨</span>
                      </button>
                    )}
                    
                    {isGeneratingStory && (
                      <div className="flex flex-col items-center py-4">
                        {generationPhase === 'image' && (
                           <>
                             <div className="text-4xl animate-bounce mb-2">🎨</div>
                             <p className="text-sky-600 font-bold uppercase tracking-widest text-sm">Painting Illustration...</p>
                           </>

                        {generationPhase === 'text' && (
                           <>
                             {storyImage && storyImage !== 'error' && (
                                <img src={storyImage} alt="Adventure preview" className="w-full max-h-48 object-cover rounded-2xl mb-4 shadow-md opacity-70" />
                             )}
                             <div className="text-4xl animate-spin mb-2 mt-2">💫</div>
                             <p className="text-sky-600 font-bold uppercase tracking-widest text-sm">Writing the Story...</p>
                           </>
                        )}
                      </div>
                    )}

                    {!isGeneratingStory && (storyImage || story) && (
                      <div className="text-left animate-pop flex flex-col items-center">
                        <h3 className="text-lg md:text-xl font-black text-indigo-600 mb-3 flex items-center gap-2 w-full"><Sparkles size={20} className="text-yellow-400"/> My Adventure</h3>
                        
                        {storyImage === 'error' && (
                          <div className="w-full h-32 bg-sky-50 rounded-2xl flex flex-col items-center justify-center mb-4 border-4 border-sky-100 border-dashed">
                            <div className="text-3xl mb-1">🙈</div><p className="text-sky-500 font-bold text-xs uppercase tracking-widest px-4 text-center">The AI couldn't draw this one,<br/>but the story is still fun!</p>
                          </div>
                        )}
                        {storyImage && storyImage !== 'error' && (
                          <img src={storyImage} alt="Adventure" className="w-full max-h-64 object-cover rounded-2xl mb-4 shadow-lg border-4 border-white animate-pop" />
                        )}

                        <p className="text-gray-700 font-bold text-sm md:text-base leading-relaxed w-full">
                          {storyWordsArray.map((word, i) => (
                            <span key={i} className={`transition-colors duration-200 ${i === highlightIndex ? 'text-sky-600 bg-yellow-200/70 rounded-md px-1' : ''}`}>{word}{' '}</span>
                          ))}
                        </p>
                        
                        {story && (
                            <button onClick={async () => { setIsReadingStory(true); setHighlightIndex(-1); await AudioEngine.speak(story, "Read this story passionately and expressively like a magical bedtime story:", "Aoede", (progress) => { const idx = Math.min(Math.floor(progress * storyWordsArray.length), storyWordsArray.length - 1); setHighlightIndex(idx); }); setHighlightIndex(-1); setIsReadingStory(false); }} disabled={isReadingStory} className="mt-4 bg-sky-200 hover:bg-sky-300 disabled:opacity-50 text-sky-800 font-bold py-2 px-4 rounded-xl text-sm flex items-center gap-2 transition-colors self-start">
                               <Volume2 size={16}/> {isReadingStory ? "Reading..." : "Read Aloud"}
                            </button>
                        )}
                      </div>
                    )}
                  </div>

                  <div className="flex flex-col gap-3 md:gap-4 w-full">
                    <button onClick={() => startGame(level)} className="w-full bg-green-500 hover:bg-green-400 text-white text-2xl font-black py-4 md:py-5 rounded-full shadow-[0_8px_0_#166534] active:shadow-none active:translate-y-2 border-4 border-white transition-all">TRY AGAIN</button>
                    <button onClick={() => setGameState('START')} className="font-bold text-gray-400 uppercase tracking-widest text-sm hover:text-gray-600 transition-colors">Home Menu</button>
                  </div>
               </div>
            </div>
          )}
        </div>
      );
    }

    // --- 2D CANVAS GAME ENGINE ---
    function TwoDGameEngine({ customChar, isPaused, onInteract }) {
      const canvasRef = useRef(null);
      const gameData = useRef({ player: { x: window.innerWidth * 0.15, y: 0, width: 110, height: 110, vy: 0, isJumping: false }, items: [], clouds: [], bgMountains: [], midHills: [], fgBushes: [], stars: [], speed: 6, lastInteractTime: 0, groundOffset: 0 });

      const interactRef = useRef(onInteract);
      useEffect(() => { interactRef.current = onInteract; }, [onInteract]);

      const isPausedRef = useRef(isPaused);
      const isInteractionLocked = useRef(false);
      
      useEffect(() => { 
          isPausedRef.current = isPaused; 
          if (!isPaused) {
              isInteractionLocked.current = false;
          }
      }, [isPaused]);

      const forestEmojis = ['🦊', '🦉', '🐰', '🐸', '🦋', '🍓', '🍄', '🍯', '🐿️', '🐌', '🐞', '🍎', '🌻', '🌲'];

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        if (gameData.current.clouds.length === 0) {
          for(let i=0; i<8; i++) gameData.current.clouds.push({ x: Math.random() * 2000, y: Math.random() * 250, size: Math.random() * 40 + 40, speed: Math.random() * 0.5 + 0.2 });
          for(let i=0; i<5; i++) gameData.current.bgMountains.push({ x: i * 500, w: 600 + Math.random() * 300, h: 250 + Math.random() * 150 });
          for(let i=0; i<4; i++) gameData.current.midHills.push({ x: i * 600, w: 700 + Math.random() * 200, h: 120 + Math.random() * 80 });
          for(let i=0; i<15; i++) gameData.current.fgBushes.push({ x: Math.random() * 2000, r: 30 + Math.random() * 40 });
          for(let i=0; i<50; i++) gameData.current.stars.push({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight * 0.6, r: Math.random() * 2, alpha: Math.random() });
        }

        const playerImg = new Image();
        let imgStatus = 'loading';
        playerImg.onload = () => { imgStatus = 'loaded'; };
        playerImg.onerror = () => { imgStatus = 'error'; };
        playerImg.src = customChar.imgUrl || '';

        const handleJump = (e) => {
          if (e && e.type === 'keydown' && e.code !== 'Space') return;
          if (e && e.type === 'keydown' && e.code === 'Space') e.preventDefault();
          const state = gameData.current;
          if (!state.player.isJumping && !isPausedRef.current) {
            state.player.vy = -18;
            state.player.isJumping = true;
            AudioEngine.jump();
          }
        };

        window.addEventListener('keydown', handleJump, { passive: false });
        window.addEventListener('touchstart', (e) => { if(!isPausedRef.current) { handleJump(); e.preventDefault(); } }, { passive: false });
        window.addEventListener('mousedown', handleJump);

        let reqId;
        const animate = () => {
          reqId = requestAnimationFrame(animate);

          if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          }

          const state = gameData.current;
          const groundY = canvas.height - 120;
          const p = state.player;
          const now = Date.now();
          
          const timeVal = now * 0.0001;
          const dayPhase = (Math.sin(timeVal) + 1) / 2;
          const nightAlpha = 1 - dayPhase;
          const sunsetAlpha = Math.max(0, 1 - Math.abs(dayPhase - 0.5) * 4);

          p.width = Math.min(110, window.innerWidth * 0.22); p.height = p.width; p.x = window.innerWidth * 0.15;

          if (!isPausedRef.current) {
            if (p.isJumping) { p.y += p.vy; p.vy += 0.8; if (p.y >= groundY - p.height) { p.y = groundY - p.height; p.isJumping = false; p.vy = 0; } } else { p.y = groundY - p.height; }

            state.groundOffset = (state.groundOffset + state.speed) % 200;
            state.clouds.forEach(c => { c.x -= c.speed; if (c.x + c.size * 2 < 0) c.x = canvas.width + 100; });
            state.bgMountains.forEach(m => { m.x -= state.speed * 0.1; if (m.x + m.w < 0) m.x = canvas.width + 100; });
            state.midHills.forEach(h => { h.x -= state.speed * 0.3; if (h.x + h.w < 0) h.x = canvas.width + 100; });
            state.fgBushes.forEach(b => { b.x -= state.speed * 1.5; if (b.x + b.r < 0) b.x = canvas.width + 100; });

            if (state.items.length < 3) {
              let lastX = state.items.length > 0 ? state.items[state.items.length - 1].x : canvas.width;
              let nextX = Math.max(canvas.width, lastX) + 400 + Math.random() * 500;
              const typeRand = Math.random();
              
              const newSize = Math.min(100, window.innerWidth * 0.20);
              let type = 'question'; 
              let yPos = groundY - newSize + 10; 
              let emoji = '';
              
              if (typeRand < 0.1) { type = 'heart'; yPos = groundY - 260; } 
              else if (typeRand < 0.4) { type = 'question'; yPos = groundY - 260; } 
              else { 
                  type = 'forest_item'; 
                  emoji = forestEmojis[Math.floor(Math.random() * forestEmojis.length)];
              }
              
              state.items.push({ x: nextX, y: yPos, size: newSize, type, emoji, active: true, offsetAnim: Math.random()*Math.PI*2, seed: Math.random() });
            }

            for (let i = state.items.length - 1; i >= 0; i--) {
              const item = state.items[i];
              item.x -= state.speed;
              if (item.x < -100) { state.items.splice(i, 1); continue; }
              const isColliding = (p.x < item.x + item.size && p.x + p.width > item.x && p.y < item.y + item.size && p.y + p.height > item.y);
              
              if (isColliding && p.isJumping && now - state.lastInteractTime > 1000 && !isInteractionLocked.current) {
                 state.items.splice(i, 1); 
                 state.lastInteractTime = now; 
                 if (item.type !== 'heart') {
                     isPausedRef.current = true; 
                     isInteractionLocked.current = true;
                 }
                 interactRef.current(item.type); 
              }
            }
          }

          const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          skyGrad.addColorStop(0, '#7dd3fc'); skyGrad.addColorStop(1, '#e0f2fe');
          ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          if (sunsetAlpha > 0) {
              ctx.globalAlpha = sunsetAlpha;
              const sunGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
              sunGrad.addColorStop(0, '#f43f5e'); sunGrad.addColorStop(1, '#fbbf24');
              ctx.fillStyle = sunGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.globalAlpha = 1.0;
          }
          if (nightAlpha > 0) {
              ctx.globalAlpha = nightAlpha;
              const nightGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
              nightGrad.addColorStop(0, '#0f172a'); nightGrad.addColorStop(1, '#312e81');
              ctx.fillStyle = nightGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
              ctx.fillStyle = 'white';
              state.stars.forEach(s => {
                 ctx.globalAlpha = nightAlpha * (0.5 + 0.5 * Math.sin(now * 0.005 + s.alpha * 10));
                 ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
              });
              ctx.globalAlpha = 1.0;
          }

          ctx.save(); ctx.translate(canvas.width/2, canvas.height); ctx.rotate(timeVal);
          ctx.fillStyle = '#fde047'; ctx.shadowBlur = 40; ctx.shadowColor = '#fde047';
          ctx.beginPath(); ctx.arc(0, -canvas.height*0.8, 50, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#e2e8f0'; ctx.shadowBlur = 30; ctx.shadowColor = 'white';
          ctx.beginPath(); ctx.arc(0, canvas.height*0.8, 40, 0, Math.PI*2); ctx.fill();
          ctx.restore(); ctx.shadowBlur = 0;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          state.clouds.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI*2); ctx.arc(c.x + c.size*0.5, c.y - c.size*0.3, c.size*0.6, 0, Math.PI*2); ctx.arc(c.x + c.size, c.y, c.size*0.8, 0, Math.PI*2); ctx.fill(); });

          ctx.fillStyle = '#0f766e'; ctx.globalAlpha = 0.6; 
          state.bgMountains.forEach(m => { ctx.beginPath(); ctx.ellipse(m.x + m.w/2, groundY, m.w/2, m.h, 0, Math.PI, 0); ctx.fill(); }); ctx.globalAlpha = 1.0;

          ctx.fillStyle = '#16a34a';
          state.midHills.forEach(h => { ctx.beginPath(); ctx.ellipse(h.x + h.w/2, groundY, h.w/2, h.h, 0, Math.PI, 0); ctx.fill(); });

          if (nightAlpha > 0) { ctx.fillStyle = 'rgba(15, 23, 42, ' + (nightAlpha * 0.6) + ')'; ctx.fillRect(0, 0, canvas.width, canvas.height); }

          ctx.fillStyle = '#b45309'; ctx.fillRect(0, groundY + 30, canvas.width, canvas.height);
          ctx.fillStyle = '#92400e';
          for(let i=0; i<canvas.width + 100; i+=40) {
            for(let j=0; j<canvas.height - groundY; j+=40) {
               if ((Math.floor(i/40) + Math.floor(j/40)) % 2 === 0) { ctx.fillRect(i - (state.groundOffset % 40), groundY + 30 + j, 20, 20); }
            }
          }
          
          ctx.fillStyle = '#4ade80'; ctx.fillRect(0, groundY, canvas.width, 30);
          ctx.fillStyle = '#16a34a'; ctx.fillRect(0, groundY + 30, canvas.width, 10);
          for(let i = 0; i < canvas.width + 200; i += 80) {
              let tx = i - (state.groundOffset % 80); ctx.beginPath(); ctx.arc(tx, groundY+40, 15, Math.PI, 0); ctx.fill();
          }

          state.items.forEach(item => {
            let drawY = item.y;
            if (item.type === 'heart' || item.type === 'question' || item.type === 'forest_item') { 
                drawY += Math.sin(now * 0.005 + item.offsetAnim) * 12; 
            }
            ctx.save(); ctx.translate(item.x, drawY);
            if (item.type === 'question') {
              ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 10;
              ctx.fillStyle = '#d97706'; ctx.fillRect(0, 0, item.size, item.size); 
              ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
              ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(item.size,0); ctx.lineTo(item.size-8,8); ctx.lineTo(8,8); ctx.lineTo(8,item.size-8); ctx.lineTo(0,item.size); ctx.fill();
              ctx.fillStyle = '#92400e'; ctx.beginPath(); ctx.moveTo(item.size,item.size); ctx.lineTo(0,item.size); ctx.lineTo(8,item.size-8); ctx.lineTo(item.size-8,item.size-8); ctx.lineTo(item.size-8,8); ctx.lineTo(item.size,0); ctx.fill();
              ctx.fillStyle = '#fbbf24'; ctx.fillRect(8, 8, item.size-16, item.size-16);
              ctx.fillStyle = '#78350f'; const r = item.size*0.06;
              ctx.beginPath(); ctx.arc(14, 14, r, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(item.size-14, 14, r, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(14, item.size-14, r, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(item.size-14, item.size-14, r, 0, Math.PI*2); ctx.fill();
              ctx.fillStyle = '#78350f'; ctx.font = `bold ${item.size * 0.6}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', item.size/2, item.size/2 + 4);
            } else if (item.type === 'heart') {
              const w = item.size * 0.5; const h = item.size * 0.5;
              ctx.translate(item.size/2, item.size/2); ctx.shadowColor = 'rgba(239,68,68,0.6)'; ctx.shadowBlur = 15; ctx.fillStyle = '#ef4444';
              ctx.beginPath(); ctx.moveTo(0, h*0.3); ctx.bezierCurveTo(w*0.5, -h*0.3, w, h*0.4, 0, h); ctx.bezierCurveTo(-w, h*0.4, -w*0.5, -h*0.3, 0, h*0.3); ctx.fill(); ctx.shadowBlur = 0;
              ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.ellipse(-w*0.2, 0, w*0.1, h*0.2, -Math.PI/4, 0, Math.PI*2); ctx.fill();
            } else if (item.type === 'forest_item') {
              ctx.font = `${item.size * 0.9}px Arial`; 
              ctx.textAlign = 'center'; 
              ctx.textBaseline = 'middle';
              ctx.shadowColor = 'rgba(0,0,0,0.6)'; 
              ctx.shadowBlur = 15; 
              ctx.shadowOffsetY = 10;
              ctx.fillText(item.emoji, item.size/2, item.size/2 + 5);
              ctx.shadowBlur = 0; 
              ctx.shadowOffsetY = 0;
              ctx.fillText(item.emoji, item.size/2, item.size/2);
              ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
              ctx.beginPath(); 
              ctx.ellipse(item.size*0.3, item.size*0.2, item.size*0.2, item.size*0.1, -Math.PI/4, 0, Math.PI*2); 
              ctx.fill();
            }
            ctx.restore();
          });

          ctx.save();
          // Drop Shadow ellipse on the ground
          ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(p.x + p.width/2, groundY, p.width*0.4, p.width*0.1, 0, 0, Math.PI*2); ctx.fill();
          
          ctx.translate(p.x + p.width/2, p.y + p.height/2);
          if (p.isJumping) { ctx.rotate(-0.15); } else if (!isPausedRef.current) { const walkCycle = Math.sin(now * 0.015); ctx.rotate(walkCycle * 0.05); ctx.translate(0, Math.abs(Math.sin(now * 0.025)) * 4 - 2); }

          if (imgStatus === 'loaded' && playerImg.width > 0) {
            const imgRatio = playerImg.width / playerImg.height;
            let drawW = p.width;
            let drawH = p.height;
            if (imgRatio > 1) { drawH = p.width / imgRatio; } else { drawW = p.height * imgRatio; }
            ctx.drawImage(playerImg, -drawW/2, -drawH/2, drawW, drawH);
          } else {
            ctx.fillStyle = '#3b82f6'; ctx.fillRect(-p.width/2, -p.height/2, p.width, p.height); ctx.fillStyle = 'white'; ctx.font = `${p.width * 0.5}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('👤', 0, 5);
          }
          ctx.restore();

          ctx.fillStyle = '#064e3b';
          state.fgBushes.forEach(b => { ctx.beginPath(); ctx.arc(b.x, canvas.height, b.r, 0, Math.PI*2); ctx.fill(); });
          if (nightAlpha > 0) { ctx.fillStyle = 'rgba(15, 23, 42, ' + (nightAlpha * 0.4) + ')'; ctx.fillRect(0, canvas.height - 100, canvas.width, 100); }
        };
        
        animate();
        return () => { cancelAnimationFrame(reqId); window.removeEventListener('keydown', handleJump); window.removeEventListener('touchstart', handleJump); window.removeEventListener('mousedown', handleJump); };
      }, [customChar.imgUrl]); 

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full block" style={{ touchAction: 'none' }} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
